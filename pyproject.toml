[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcolab-mcp"
version = "0.1.1"
description = "Full-parity CLI & Model Context Protocol (MCP) server for consumer Google Colab automation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Treamyracle" }
]
keywords = ["mcp", "colab", "google-colab", "jupyter", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "keyring>=24.0.0",
    "cryptography>=42.0.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "nbformat>=5.9.0",
    "pydantic>=2.6.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.42.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
all = [
    "colab-mcp[browser,dev]",
]

[project.scripts]
colab-mcp = "colab_mcp.cli:app"
gcolab-mcp = "colab_mcp.cli:app"

[project.urls]
Homepage = "https://github.com/Treamyracle/colab-mcp"
Repository = "https://github.com/Treamyracle/colab-mcp"
Documentation = "https://github.com/Treamyracle/colab-mcp/blob/main/docs/ARCHITECTURE.md"
Changelog = "https://github.com/Treamyracle/colab-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/Treamyracle/colab-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/colab_mcp"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
